<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Management System</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-in {
      background: var(--success);
      color: #052e16;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-out {
      background: #f59e0b;
      color: #451a03;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-del {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 5px 8px;
      font-size: 0.8rem;
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
      font-size: 0.8rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-active {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .badge-expired {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .badge-inside {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .table-wrapper {
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Gym Log & Subscription Tracker</h1>
      <p style="color: var(--muted); font-size: 0.85rem;">Tracks member subscriptions and exact check-in / check-out times</p>
    </div>
    <button class="btn-secondary" onclick="exportLogsCSV()">Export Logs (CSV)</button>
  </header>

  <div class="grid">
    <!-- Add Member Form -->
    <div class="card">
      <h2>Register / Renew Member</h2>
      <form id="memberForm">
        <div class="form-group">
          <label for="memberName">Member Full Name</label>
          <input type="text" id="memberName" placeholder="e.g., Juan Dela Cruz" required />
        </div>
        <div class="form-group">
          <label for="subPlan">Subscription Plan</label>
          <select id="subPlan">
            <option value="1">Daily Walk-in (1 Day)</option>
            <option value="30" selected>Monthly (30 Days)</option>
            <option value="90">Quarterly (90 Days)</option>
            <option value="365">Annual (365 Days)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" required />
        </div>
        <button type="submit" class="btn-primary">Save Member</button>
      </form>
    </div>

    <!-- Active Members List -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h2 style="margin-bottom: 0;">Members & Subscriptions</h2>
        <input type="text" id="searchInput" placeholder="Search name..." style="width: 200px; padding: 6px 10px;" oninput="renderAll()" />
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Plan</th>
              <th>Expires</th>
              <th>Status</th>
              <th>Check In / Out</th>
            </tr>
          </thead>
          <tbody id="membersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Time In / Time Out History -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <h2 style="margin-bottom: 0;">Attendance Log (Time In & Time Out)</h2>
      <button class="btn-del" onclick="clearLogs()">Clear History</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Member Name</th>
            <th>Date</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody id="logsTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Load saved data from browser localStorage
  let members = JSON.parse(localStorage.getItem('gym_members')) || [];
  let logs = JSON.parse(localStorage.getItem('gym_logs')) || [];

  // Default start date to today
  document.getElementById('startDate').valueAsDate = new Date();

  function saveData() {
    localStorage.setItem('gym_members', JSON.stringify(members));
    localStorage.setItem('gym_logs', JSON.stringify(logs));
  }

  // Register a new member
  document.getElementById('memberForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('memberName').value.trim();
    const days = parseInt(document.getElementById('subPlan').value, 10);
    const startVal = document.getElementById('startDate').value;

    const startDate = new Date(startVal);
    const expiryDate = new Date(startDate);
    expiryDate.setDate(expiryDate.getDate() + days);

    const planLabels = {
      1: 'Walk-in (1d)',
      30: 'Monthly (30d)',
      90: 'Quarterly (90d)',
      365: 'Annual (1yr)'
    };

    members.push({
      id: Date.now().toString(),
      name: name,
      plan: planLabels[days],
      expiry: expiryDate.toISOString().split('T')[0],
      isInside: false
    });

    saveData();
    document.getElementById('memberName').value = '';
    renderAll();
  });

  // Check In function
  function checkIn(memberId) {
    const member = members.find(m => m.id === memberId);
    if (!member || member.isInside) return;

    const now = new Date();
    member.isInside = true;

    logs.unshift({
      logId: Date.now().toString(),
      memberId: member.id,
      name: member.name,
      date: now.toLocaleDateString(),
      timeIn: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      timeInRaw: now.getTime(),
      timeOut: null,
      duration: 'In Gym'
    });

    saveData();
    renderAll();
  }

  // Check Out function
  function checkOut(memberId) {
    const member = members.find(m => m.id === memberId);
    if (!member || !member.isInside) return;

    const now = new Date();
    member.isInside = false;

    // Find their open log entry
    const activeLog = logs.find(l => l.memberId === memberId && l.timeOut === null);
    if (activeLog) {
      activeLog.timeOut = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const diffMins = Math.max(1, Math.round((now.getTime() - activeLog.timeInRaw) / 60000));
      const hrs = Math.floor(diffMins / 60);
      const mins = diffMins % 60;
      activeLog.duration = hrs > 0 ? `${hrs}h ${mins}m` : `${mins} mins`;
    }

    saveData();
    renderAll();
  }

  function deleteMember(memberId) {
    if (!confirm('Remove this member?')) return;
    members = members.filter(m => m.id !== memberId);
    saveData();
    renderAll();
  }

  function clearLogs() {
    if (!confirm('Clear all attendance logs?')) return;
    logs = [];
    members.forEach(m => m.isInside = false);
    saveData();
    renderAll();
  }

  function exportLogsCSV() {
    if (logs.length === 0) return alert('No logs to export.');
    let csv = 'Name,Date,Time In,Time Out,Duration\n';
    logs.forEach(l => {
      csv += `"${l.name}","${l.date}","${l.timeIn}","${l.timeOut || 'Still Inside'}","${l.duration}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gym-attendance-${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
  }

  function renderAll() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const today = new Date().toISOString().split('T')[0];

    // Render Members
    const membersTbody = document.getElementById('membersTable');
    membersTbody.innerHTML = '';

    members
      .filter(m => m.name.toLowerCase().includes(search))
      .forEach(m => {
        const isExpired = m.expiry < today;
        const statusBadge = m.isInside
          ? `<span class="badge badge-inside">Inside Gym</span>`
          : isExpired
            ? `<span class="badge badge-expired">Expired</span>`
            : `<span class="badge badge-active">Active</span>`;

        const actionBtn = m.isInside
          ? `<button class="btn-out" onclick="checkOut('${m.id}')">Time Out</button>`
          : `<button class="btn-in" onclick="checkIn('${m.id}')">Time In</button>`;

        membersTbody.innerHTML += `
          <tr>
            <td><strong>${m.name}</strong></td>
            <td>${m.plan}</td>
            <td>${m.expiry}</td>
            <td>${statusBadge}</td>
            <td class="actions">
              ${actionBtn}
              <button class="btn-del" onclick="deleteMember('${m.id}')">X</button>
            </td>
          </tr>
        `;
      });

    // Render Logs
    const logsTbody = document.getElementById('logsTable');
    logsTbody.innerHTML = '';

    logs.forEach(l => {
      logsTbody.innerHTML += `
        <tr>
          <td><strong>${l.name}</strong></td>
          <td>${l.date}</td>
          <td>${l.timeIn}</td>
          <td>${l.timeOut || '<span style="color:#60a5fa;">Active Session</span>'}</td>
          <td>${l.duration}</td>
        </tr>
      `;
    });
  }

  renderAll();
</script>

</body>
</html>
